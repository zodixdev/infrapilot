syntax = "proto3";

package infrapilot.controlplane.v1;

import "google/protobuf/timestamp.proto";

// ProjectService manages projects inside an organization.
service ProjectService {
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse);
  // Soft-deletes the project, its resources and revokes its API keys.
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);
}

message Project {
  string id = 1;
  string organization_id = 2;
  string name = 3;
  // URL-safe handle unique within the organization: lowercase letters, digits and hyphens, 3–63 characters,
  // starting with a letter and not ending with a hyphen.
  string slug = 4;
  string description = 5;
  google.protobuf.Timestamp create_time = 6;
  google.protobuf.Timestamp update_time = 7;
}

message CreateProjectRequest {
  string organization_id = 1;
  string name = 2;
  string slug = 3;
  string description = 4;
}

message CreateProjectResponse {
  Project project = 1;
}

message GetProjectRequest {
  string organization_id = 1;
  string project_id = 2;
}

message GetProjectResponse {
  Project project = 1;
}

message ListProjectsRequest {
  string organization_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListProjectsResponse {
  repeated Project projects = 1;
  string next_page_token = 2;
}

message UpdateProjectRequest {
  string organization_id = 1;
  string project_id = 2;
  optional string name = 3;
  optional string slug = 4;
  optional string description = 5;
}

message UpdateProjectResponse {
  Project project = 1;
}

message DeleteProjectRequest {
  string organization_id = 1;
  string project_id = 2;
}

message DeleteProjectResponse {}
