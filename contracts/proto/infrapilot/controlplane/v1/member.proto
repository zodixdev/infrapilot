syntax = "proto3";

package infrapilot.controlplane.v1;

import "google/protobuf/timestamp.proto";
import "infrapilot/controlplane/v1/common.proto";

// MemberService manages organization memberships. Every change is written to the audit log.
service MemberService {
  // Adds a user who has signed in at least once, identified by e-mail.
  rpc AddMember(AddMemberRequest) returns (AddMemberResponse);
  rpc GetMember(GetMemberRequest) returns (GetMemberResponse);
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  rpc UpdateMemberRole(UpdateMemberRoleRequest) returns (UpdateMemberRoleResponse);
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);
}

message Member {
  string user_id = 1;
  string organization_id = 2;
  string email = 3;
  string display_name = 4;
  Role role = 5;
  google.protobuf.Timestamp create_time = 6;
  google.protobuf.Timestamp update_time = 7;
}

message AddMemberRequest {
  string organization_id = 1;
  string email = 2;
  Role role = 3;
}

message AddMemberResponse {
  Member member = 1;
}

message GetMemberRequest {
  string organization_id = 1;
  string user_id = 2;
}

message GetMemberResponse {
  Member member = 1;
}

message ListMembersRequest {
  string organization_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListMembersResponse {
  repeated Member members = 1;
  string next_page_token = 2;
}

message UpdateMemberRoleRequest {
  string organization_id = 1;
  string user_id = 2;
  Role role = 3;
}

message UpdateMemberRoleResponse {
  Member member = 1;
}

message RemoveMemberRequest {
  string organization_id = 1;
  string user_id = 2;
}

message RemoveMemberResponse {}
