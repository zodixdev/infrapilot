# api-gateway on kind (make deploy-services). Reached from the host on 127.0.0.1:28080 (NodePort 30080).
environment: test
replicaCount: 2
hpa:
  enabled: false   # no metrics-server in kind; fixed replicas keep load tests comparable
tests:
  enabled: true
service:
  type: NodePort
  nodePorts: {http: 30080}
envFrom:
  - configMapRef: {name: infrapilot-otlp}
extraEnv:
  - name: OIDC_ISSUER
    value: http://localhost:28180/realms/infrapilot
  - name: OIDC_JWKS_URL
    value: http://keycloak.infrapilot-deps.svc:8080/realms/infrapilot/protocol/openid-connect/certs
  # The dashboard client and the test-only password-grant client created by the load and e2e tests.
  - name: OIDC_AUTHORIZED_PARTIES
    value: infrapilot-dashboard,infrapilot-e2e
  - name: REDIS_ADDR
    value: redis.infrapilot-deps.svc:6379
  - name: REDIS_TLS
    value: "false"
  - name: CORS_ALLOWED_ORIGINS
    value: http://localhost:3000
  - name: TRUSTED_PROXIES
    value: ""
networkPolicy:
  # kind has no ingress controller: the NodePort is reached from the node itself.
  ingress:
    - ipBlock: {cidr: 0.0.0.0/0}
  egress:
    rules:
      - to:
          - podSelector: {matchLabels: {app.kubernetes.io/name: control-plane}}
        ports: [{port: 9090, protocol: TCP}]
      - to:
          - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: infrapilot-deps}}
            podSelector: {matchLabels: {app: redis}}
        ports: [{port: 6379, protocol: TCP}]
      - to:
          - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: infrapilot-deps}}
            podSelector: {matchLabels: {app: keycloak}}
        ports: [{port: 8080, protocol: TCP}]
