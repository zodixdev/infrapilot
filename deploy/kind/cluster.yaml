# Local Kubernetes cluster for deploying InfraPilot charts (ADR-0011). Created by `make cluster`.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: infrapilot
nodes:
  - role: control-plane
    image: kindest/node:v1.34.0
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            enable-admission-plugins: NodeRestriction,PodSecurity
    labels:
      infrapilot.io/role: worker
