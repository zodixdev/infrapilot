# Internal CA for workload identities (ADR-0025): a self-signed root kept in the cert-manager namespace, and the
# ClusterIssuer infrapilot-internal-ca that service charts reference. Local clusters only; production roots its CA
# in a managed PKI.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: infrapilot-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: infrapilot-internal-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: infrapilot-internal-ca
  secretName: infrapilot-internal-ca
  duration: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: infrapilot-selfsigned
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: infrapilot-internal-ca
spec:
  ca:
    secretName: infrapilot-internal-ca
