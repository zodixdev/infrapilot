# Namespace of the InfraPilot services; their Secrets (database URLs, Redis password, cache signing key) are
# created there from the credentials generated by this chart.
servicesNamespace: infrapilot
# Databases provisioned with the three ADR-0018 roles each.
services: [controlplane]
postgres:
  image: postgres:17.6-alpine
  storage: 1Gi
redis:
  image: redis:7.4-alpine
keycloak:
  image: quay.io/keycloak/keycloak:26.4.5
  # Browser-facing URL (kind maps host 127.0.0.1:28180 to nodePort 30180): the token issuer.
  hostname: http://localhost:28180
  nodePort: 30180
# OTLP collector reachable from kind nodes (docker compose obs profile on the host).
otlp:
  endpoint: host.docker.internal:4317
