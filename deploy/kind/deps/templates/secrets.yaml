{{- $ns := .Release.Namespace -}}
{{- $creds := dict -}}
{{- range $k := list "postgres-password" "service-db-password" "keycloak-db-password" "keycloak-admin-password" "redis-password" "cache-signing-key" -}}
{{- $_ := set $creds $k (include "deps.secretValue" (dict "ns" $ns "key" $k)) -}}
{{- end -}}
{{- $pgHost := printf "postgres.%s.svc:5432" $ns -}}
{{- $pw := index $creds "service-db-password" -}}
apiVersion: v1
kind: Secret
metadata:
  name: deps-credentials
  namespace: {{ $ns }}
type: Opaque
data:
  {{- range $k, $v := $creds }}
  {{ $k }}: {{ $v | b64enc }}
  {{- end }}
  keycloak-admin-user: {{ "admin" | b64enc }}
---
# Service credentials in the services namespace (what External Secrets provides in production).
apiVersion: v1
kind: Secret
metadata:
  name: control-plane-db
  namespace: {{ .Values.servicesNamespace }}
type: Opaque
stringData:
  app-url: {{ printf "postgres://controlplane_app:%s@%s/controlplane?sslmode=disable" $pw $pgHost | quote }}
  migrator-url: {{ printf "postgres://controlplane_migrator:%s@%s/controlplane?sslmode=disable" $pw $pgHost | quote }}
  batch-url: {{ printf "postgres://controlplane_batch:%s@%s/controlplane?sslmode=disable" $pw $pgHost | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-redis
  namespace: {{ .Values.servicesNamespace }}
type: Opaque
stringData:
  password: {{ index $creds "redis-password" | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-cache
  namespace: {{ .Values.servicesNamespace }}
type: Opaque
stringData:
  signing-key: {{ index $creds "cache-signing-key" | quote }}
---
# Telemetry settings shared by the services (push to the host's compose obs stack, ADR-0019).
apiVersion: v1
kind: ConfigMap
metadata:
  name: infrapilot-otlp
  namespace: {{ .Values.servicesNamespace }}
data:
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.otlp.endpoint | quote }}
  OTEL_EXPORTER_OTLP_INSECURE: "true"
  TELEMETRY_METRICS_PUSH: "true"
  TELEMETRY_LOGS_PUSH: "true"
  TELEMETRY_METRIC_EXPORT_INTERVAL: "10s"
