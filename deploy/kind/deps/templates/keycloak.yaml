apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
data:
  infrapilot-realm.json: |
{{ .Files.Get "files/infrapilot-realm.json" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  type: NodePort
  selector: {app: keycloak}
  ports:
    - {name: http, port: 8080, targetPort: 8080, nodePort: {{ .Values.keycloak.nodePort }}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels: {app: keycloak}
  template:
    metadata:
      labels: {app: keycloak}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image }}
          args: ["start-dev", "--http-port=8080", "--import-realm"]
          env:
            - {name: KC_DB, value: postgres}
            - {name: KC_DB_URL, value: "jdbc:postgresql://postgres:5432/keycloak"}
            - {name: KC_DB_USERNAME, value: keycloak}
            - name: KC_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: deps-credentials, key: keycloak-db-password}}
            - {name: KC_DB_POOL_MAX_SIZE, value: "10"}
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom: {secretKeyRef: {name: deps-credentials, key: keycloak-admin-user}}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: deps-credentials, key: keycloak-admin-password}}
            # Tokens are issued for the browser-facing URL; in-cluster callers (the gateway's JWKS fetch) use the
            # Service name through the dynamic backchannel.
            - {name: KC_HOSTNAME, value: {{ .Values.keycloak.hostname | quote }}}
            - {name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC, value: "true"}
            - {name: KC_HEALTH_ENABLED, value: "true"}
            - {name: JAVA_OPTS_KC_HEAP, value: "-Xms256m -Xmx512m"}
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 9000}
          readinessProbe:
            httpGet: {path: /health/ready, port: management}
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {memory: 900Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}
      volumes:
        - name: realm
          configMap: {name: keycloak-realm}
