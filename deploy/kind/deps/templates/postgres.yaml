apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  01-roles.sh: |
{{ .Files.Get "files/01-roles.sh" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      securityContext:
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          args: ["-c", "max_connections=200", "-c", "shared_preload_libraries=pg_stat_statements"]
          env:
            - {name: POSTGRES_USER, value: postgres}
            - {name: POSTGRES_DB, value: postgres}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: deps-credentials, key: postgres-password}}
            - name: KEYCLOAK_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: deps-credentials, key: keycloak-db-password}}
            - name: INFRAPILOT_SERVICE_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: deps-credentials, key: service-db-password}}
            - {name: INFRAPILOT_SERVICES, value: {{ join "," .Values.services | quote }}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "postgres", "-d", "postgres"]}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL], add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - name: init
          configMap: {name: postgres-init}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: {{ .Values.postgres.storage }}}
