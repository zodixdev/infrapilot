# Representative production render for scripts/helm-check.sh: every dependency has an egress rule.
environment: prod
networkPolicy:
  egress:
    rules:
      - to: [{ipBlock: {cidr: 10.20.0.0/24}}]   # PostgreSQL
        ports: [{port: 5432, protocol: TCP}]
migration:
  egress:
    - to: [{ipBlock: {cidr: 10.20.0.0/24}}]
      ports: [{port: 5432, protocol: TCP}]
cronJobs:
  - name: purge
    schedule: "17 * * * *"
    args: [purge]
    env:
      - name: BATCH_DATABASE_URL
        valueFrom:
          secretKeyRef: {name: control-plane-db, key: batch-url}
    egress:
      - to: [{ipBlock: {cidr: 10.20.0.0/24}}]
        ports: [{port: 5432, protocol: TCP}]
