# api-gateway values. Environment-specific files set environment, image, OIDC URLs, Redis and egress.
# Secrets are never set here: the Secrets api-gateway-redis (key password) and api-gateway-cache (key signing-key,
# at least 32 random bytes) are created by the platform.
environment: ""
image:
  repository: infrapilot/api-gateway
  tag: ""
replicaCount: 2
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
ports:
  http: 8080
  admin: 8081
  grpc: 0   # no internal API (0 disables; null would fall back to the library default)
resources:
  requests:
    cpu: 100m
    memory: 96Mi
  limits:
    memory: 256Mi
# The workload certificate is the mTLS client identity towards internal services (ADR-0025).
tls:
  enabled: true
env:
  - name: CACHE_SIGNING_KEY
    valueFrom:
      secretKeyRef: {name: api-gateway-cache, key: signing-key}
  - name: REDIS_PASSWORD
    valueFrom:
      secretKeyRef: {name: api-gateway-redis, key: password}
  - name: CONTROLPLANE_TARGET
    value: dns:///control-plane-grpc.infrapilot.svc:9090
  - name: CONTROLPLANE_SERVER_NAME
    value: control-plane-grpc.infrapilot.svc
  - name: CONTROLPLANE_SERVER_IDENTITY
    value: spiffe://infrapilot.local/ns/infrapilot/sa/control-plane
  - name: CONTROLPLANE_TLS_CERT_FILE
    value: /etc/infrapilot/tls/tls.crt
  - name: CONTROLPLANE_TLS_KEY_FILE
    value: /etc/infrapilot/tls/tls.key
  - name: CONTROLPLANE_TLS_CA_FILE
    value: /etc/infrapilot/tls/ca.crt
  - name: GRPC_DISABLED
    value: "true"
# Environment-specific settings (an environment's values file replaces this list as a whole).
extraEnv:
  - name: OIDC_ISSUER
    value: https://auth.infrapilot.example.com/realms/infrapilot
  - name: OIDC_JWKS_URL
    value: https://auth.infrapilot.example.com/realms/infrapilot/protocol/openid-connect/certs
  - name: OIDC_AUTHORIZED_PARTIES
    value: infrapilot-dashboard
  - name: REDIS_ADDR
    value: redis:6379
  - name: REDIS_TLS
    value: "true"
  - name: CORS_ALLOWED_ORIGINS
    value: https://app.infrapilot.example.com
  # The ingress controller pods' CIDR (their X-Forwarded-For is trusted for client-IP rate limiting). Empty: only
  # the TCP peer address counts.
  - name: TRUSTED_PROXIES
    value: ""
networkPolicy:
  ingress:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
  egress:
    rules:
      - to:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: control-plane
        ports:
          - {port: 9090, protocol: TCP}
      # Redis and the identity provider: set per environment.
