# InfraPilot CI — mirrors `make verify` plus image/cluster checks. Every job is a thin wrapper around a
# Make target so local runs (`make verify`, `act -j lint`) and CI stay identical.
# Actions are pinned to commit SHAs (tag in the comment); Dependabot proposes updates.
name: ci

on:
  push:
    branches: [main]
    tags: ["milestone/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Toolchain is pinned by the `toolchain` directive in go.work; auto mode lets setup-go honour it.
  GOTOOLCHAIN: auto
  GOFLAGS: -buildvcs=false

jobs:
  lint:
    name: lint (go, proto, helm, observability, docker)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # buf breaking compares against origin/main
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.work
          cache-dependency-path: |
            pkg/go.sum
            tests/go.sum
            tools/go.sum
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.19.0
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: tests/platform/conformance/Dockerfile
      - run: make fmt-check lint-go lint-proto lint-helm lint-obs
      - name: Generated code is up to date
        run: make gen && git diff --exit-code -- gen/

  test:
    name: unit tests (race)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.work
          cache-dependency-path: |
            pkg/go.sum
            tests/go.sum
            tools/go.sum
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.19.0
      - run: make test

  integration:
    name: integration tests (testcontainers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.work
          cache-dependency-path: |
            pkg/go.sum
            tests/go.sum
            tools/go.sum
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.19.0
      - run: make test-integration

  security:
    name: govulncheck + gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.work
          cache-dependency-path: |
            pkg/go.sum
            tests/go.sum
            tools/go.sum
      - run: make vuln
      - name: gitleaks (full history)
        run: go tool gitleaks git --redact --no-banner --config .gitleaks.toml .

  image:
    name: build image + SBOM + trivy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build conformance image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: tests/platform/conformance/Dockerfile
          tags: infrapilot/conformance:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: infrapilot/conformance:ci
          format: spdx-json
          artifact-name: conformance-sbom.spdx.json
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: infrapilot/conformance:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Save the scanned image
        run: docker save infrapilot/conformance:ci -o /tmp/conformance.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-image
          path: /tmp/conformance.tar
          retention-days: 1

  kind-e2e:
    name: kind deploy + helm test + e2e (scanned image)
    runs-on: ubuntu-24.04
    needs: [image]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.work
          cache-dependency-path: |
            pkg/go.sum
            tests/go.sum
            tools/go.sum
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.19.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: conformance-image
          path: /tmp
      - run: docker load -i /tmp/conformance.tar
      - name: Observability stack (compose obs profile)
        # Linux runner: kind nodes reach the host collector through the docker bridge gateway, so only the
        # OTLP ports are published beyond loopback (ephemeral runner, no other listeners exposed).
        run: make secrets && OTLP_BIND_ADDR=0.0.0.0 make up PROFILE=obs
      - name: kind cluster
        run: make cluster
      - name: Deploy the scanned image and run helm test
        run: make deploy-only CONFORMANCE_IMAGE=infrapilot/conformance:ci OTLP_ENDPOINT=172.17.0.1:4317
      - name: e2e (traces in Tempo, metrics in Prometheus, logs in Loki)
        run: make e2e
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl --context kind-infrapilot -n infrapilot-test get all
          kubectl --context kind-infrapilot -n infrapilot-test describe pods
          kubectl --context kind-infrapilot -n infrapilot-test logs -l app.kubernetes.io/name=conformance --tail=200
          docker compose --project-name infrapilot --env-file .env -f deploy/compose/docker-compose.yml --profile '*' logs --tail=100
