# Weekly update proposals for pinned dependencies (actions by SHA, Go modules incl. the tools module,
# container base images).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: gomod
    directories: [/pkg, /gen, /tests, /tools]
    schedule: { interval: weekly }
    groups:
      opentelemetry:
        patterns: ["go.opentelemetry.io/*"]
  - package-ecosystem: docker
    directories: [/tests/platform/conformance]
    schedule: { interval: weekly }
