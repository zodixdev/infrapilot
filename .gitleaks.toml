# gitleaks configuration: default rules plus a narrow allowlist.
title = "InfraPilot"

[extend]
useDefault = true

[allowlist]
description = "Lock files and empty template assignments"
paths = [
  '''go\.sum$''',
]
# .env.example may only contain empty secret assignments; any real value in it is reported.
regexes = [
  '''(?m)^[A-Z0-9_]+=$''',
]
