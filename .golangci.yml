# golangci-lint v2 configuration — strict by default (AGENTS.md §5).
version: "2"

run:
  timeout: 10m
  build-tags:
    - integration
    - e2e
  modules-download-mode: readonly

linters:
  default: standard
  enable:
    - bodyclose
    - containedctx
    - contextcheck
    - copyloopvar
    - durationcheck
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - gocritic
    - gosec
    - iface
    - intrange
    - makezero
    - misspell
    - nilerr
    - nilnesserr
    - noctx
    - nolintlint
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
    govet:
      enable-all: true
      disable:
        - fieldalignment # layout-for-size hints hurt readability of config structs
      settings:
        shadow:
          strict: false
    gocritic:
      enabled-tags: [diagnostic, performance, style]
      disabled-checks:
        - hugeParam        # structs passed by value are a deliberate API choice in places
        - unnamedResult
        - paramTypeCombine
    gosec:
      excludes:
        - G104 # duplicate of errcheck
    revive:
      rules:
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: defer
        - name: unhandled-error
          arguments: ["fmt.Print.*", "fmt.Fprint.*", "bytes.Buffer.Write.*", "strings.Builder.Write.*"]
    sloglint:
      attr-only: true
      no-global: all
      context: scope
      static-msg: true
      key-naming-case: snake
    exhaustive:
      default-signifies-exhaustive: true
    nolintlint:
      require-explanation: true
      require-specific: true
    testifylint:
      enable-all: true
    usetesting:
      context-background: true
      context-todo: true
  exclusions:
    generated: lax
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      - path: _test\.go
        linters: [gosec, noctx, forcetypeassert, containedctx, unparam, sloglint]
      - path: _test\.go
        text: "unused-parameter"
        linters: [revive]
    paths:
      - gen/

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/zodixdev/infrapilot
  exclusions:
    paths:
      - gen/
