# Server code for the public API (ADR-0003: generated strict server, so spec and code cannot drift; ADR-0020:
# document stays on OpenAPI 3.0.3). `make gen` regenerates; CI fails if the output is stale.
package: api
output: internal/transport/http/api/api.gen.go
generate:
  models: true
  std-http-server: true
  strict-server: true
  embedded-spec: true
output-options:
  skip-prune: true
